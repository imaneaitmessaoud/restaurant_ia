# config/services.yaml
parameters: { }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  
  App\Service\MenuExcelReader:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\MenuProvider:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\InfoProvider:
    arguments:
      $projectDir: '%kernel.project_dir%'
  
  App\Service\PersonalizationService: ~
