<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Sign In - Feane Style</title>

  <!-- ✅ Bootstrap via CDN (évite les 404) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-GTFQGvGq5rGQf4n6Hk7kb0+u5w2zqk3m0qk6v6B5sKzM1tX1q2sR3d1G9I6iZ9i5"
    crossorigin="anonymous"
  />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .signin-card {
      background: rgba(30, 30, 30, 0.95);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      width: 100%;
      max-width: 400px;
    }
    .signin-card h2 {
      margin-bottom: 30px;
      font-weight: 600;
      text-align: center;
    }
    .form-control {
      background: #1f1f1f;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 20px;      /* champs plus grands */
      font-size: 18px;    /* texte grand */
    }
    .form-control:focus {
      background: #292929;
      color: #fff;
      box-shadow: 0 0 5px #ffbe33;
      border: none;
    }
    .form-group { margin-bottom: 25px; } /* espace entre champs */
    .btn-yellow {
      background-color: #ffbe33;
      color: #0c0c0c;
      font-weight: 600;
      width: 50%;         /* bouton plus petit */
      padding: 8px;       /* moins haut */
      font-size: 14px;    /* texte plus petit */
      border-radius: 8px;
      transition: 0.3s;
      display: block;
      margin: 0 auto;     /* centré */
    }
    .btn-yellow:hover {
      background-color: #e6a800;
      color: #fff;
    }
    .links { text-align: center; margin-top: 15px; }
    .links a { color: #ffbe33; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .alert-mini {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

<div class="signin-card">
  <h2>Sign In</h2>

  <div id="msg" class="alert-mini alert-danger"></div>

  <form id="signinForm" novalidate>
    <div class="form-group mb-3">
      <input type="email" class="form-control" placeholder="Email" required name="email" />
    </div>
    <div class="form-group mb-3">
      <input type="password" class="form-control" placeholder="Password" required name="password" />
    </div>
    <button id="btnSignin" type="submit" class="btn btn-yellow">Sign In</button>
  </form>

  <div class="links">
    <p>Don’t have an account? <a href="signup.html">Sign Up</a></p>
  </div>
</div>

<!-- ✅ Bootstrap JS via CDN (évite les 404) -->
<script
  src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
  integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
  crossorigin="anonymous"></script>
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
  crossorigin="anonymous"></script>

<script>
  const BACKEND = (location.port === '8000')
    ? '/api/auth/signin'
    : 'http://127.0.0.1:8000/api/auth/signin';

  const form = document.getElementById('signinForm');
  const msg  = document.getElementById('msg');
  const btn  = document.getElementById('btnSignin');

  function showError(text) {
    msg.textContent = text;
    msg.style.display = 'block';
  }
  function hideError() {
    msg.style.display = 'none';
    msg.textContent = '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email    = e.target.email.value.trim();
    const password = e.target.password.value;

    if (!email || !password) {
      showError('Email et mot de passe requis.');
      return;
    }

    // désactive le bouton pendant la requête
    btn.disabled = true; btn.textContent = '...';

    try {
      const res = await fetch(BACKEND, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // si tu as activé les cookies côté backend, ajoute:
        // credentials: 'include',
        body: JSON.stringify({ email, password })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        showError(data.error || `Erreur ${res.status}`);
        return;
      }

      // ✅ succès : redirection
      window.location.href = 'indexadmin.html';
    } catch (err) {
      console.error(err);
      showError('Impossible de joindre le serveur.');
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
